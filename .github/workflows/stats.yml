name: Update Profile Statistics

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Generate profile statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: KylianRDR
        run: node scripts/generate-stats.mjs

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push
